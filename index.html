<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll Calculator</title>
<!-- Payroll Calculator. Designed and built by Princes Joy Garcia. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: black single-column editorial site with three views (home, sign in, calculator).
     Oversized light uppercase headings, hairline-outlined cards, pill buttons with a round arrow, floating glass shapes. */
  :root {
    --bg: #000000;
    --fg: #f2f2f0;
    --muted: #a3a3a0;
    --line: rgba(255, 255, 255, 0.5);
    --pill: #dcdcda;
    --ink: #000000;
    --err: #ff8a8a;
    --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    --body: "Inter", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .page { position: relative; overflow-x: clip; }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    position: relative;
  }
  h1, h2, h3 { font-family: var(--display); font-weight: 300; text-transform: uppercase; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  a { color: inherit; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .view[hidden] { display: none !important; }

  /* nav */
  nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 28px; position: relative; z-index: 3; }
  .logo { font-family: var(--display); font-weight: 500; font-size: 1.15rem; text-decoration: none; }
  .links { display: flex; gap: clamp(14px, 4vw, 40px); font-size: 0.8rem; }
  .links a { text-decoration: none; color: var(--muted); }
  .links a:hover, .links a[aria-current="page"] { color: var(--fg); }
  .navright { display: flex; align-items: center; gap: 12px; }
  .who { font-size: 0.72rem; color: var(--muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* pills */
  .pill-row { display: inline-flex; align-items: center; gap: 6px; }
  .pill {
    font: 500 0.8rem var(--body);
    background: var(--pill); color: var(--ink);
    border: 0; border-radius: 999px; padding: 0.7rem 1.6rem;
    cursor: pointer; text-decoration: none; display: inline-block;
  }
  .pill:hover { background: #fff; }
  .pill.sm { padding: 0.55rem 1.4rem; }
  .dot {
    width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--pill); color: var(--ink);
    display: grid; place-items: center; text-decoration: none; font-size: 1rem;
  }
  .dot:hover { background: #fff; }
  .pill.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .pill.ghost:hover { background: rgba(255,255,255,0.1); }

  /* glass shapes */
  .glass {
    position: absolute; width: var(--s); aspect-ratio: 1; border-radius: 30%;
    background: conic-gradient(from 210deg, #e8e6ff, #ffc7e6 18%, #ffe6a8 34%, #bff5e8 52%, #c4d2ff 70%, #f3d6ff 86%, #e8e6ff);
    box-shadow: 0 0 44px rgba(170, 160, 255, 0.28), inset 0 0 12px rgba(255, 255, 255, 0.6);
    transform: rotate(var(--r)); pointer-events: none; z-index: 1;
    animation: float 9s ease-in-out infinite;
  }
  .glass::before { content: ""; position: absolute; inset: 21%; border-radius: 26%; background: #000; box-shadow: inset 0 0 14px rgba(255,255,255,0.25); }
  .glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, rgba(255,255,255,0.5), transparent 42%); }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(var(--r)); }
    50% { transform: translateY(-12px) rotate(calc(var(--r) + 4deg)); }
  }
  @media (prefers-reduced-motion: reduce) { .glass { animation: none; } }

  /* hero */
  .hero { padding-block: 40px 70px; position: relative; }
  .hero h1 { font-size: clamp(2.6rem, 9.5vw, 5.4rem); line-height: 0.98; letter-spacing: -0.02em; position: relative; z-index: 2; }
  .hero h1 span { display: block; }
  .hero h1 span:nth-child(1) { padding-left: 14%; }
  .hero h1 span:nth-child(2) { padding-left: 22%; }
  .hero h1 span:nth-child(3) { padding-left: 36%; }
  .hero .sub { margin: 26px 0 22px 36%; max-width: 330px; font-size: 0.8rem; position: relative; z-index: 2; }
